name: Build Client and Server for Windows and Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Create output directory
      run: mkdir -p bin

    - name: Build Client
      run: |
        suffix=""
        if [ "${{ matrix.goos }}" = "windows" ]; then
          suffix=".exe"
        fi
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
        go build -o bin/client-${{ matrix.goos }}-${{ matrix.goarch }}${suffix} ./client

    - name: Build Server
      run: |
        suffix=""
        if [ "${{ matrix.goos }}" = "windows" ]; then
          suffix=".exe"
        fi
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
        go build -o bin/server-${{ matrix.goos }}-${{ matrix.goarch }}${suffix} ./backend/cmd/server

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/
